name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7d590
        with:
          fetch-depth: 0

      - uses: actions/setup-java@99b8673ff64fbf33d8d8f9424cc60f1886c51f1d
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@600c74633a7c50c6f1a1c0ec64e18f0ead2db7c5

      - name: Build, Test, Coverage and Sonar
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build jacocoTestReport sonar